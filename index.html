<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mobile Shooter</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(15, 23, 42, 0.8);
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #e5e7eb;
      --warning: #fbbf24;
      --shadow: rgba(0,0,0,0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-shell {
      width: min(100vw, 440px);
      height: 100vh;
      max-height: 900px;
      position: relative;
      background: linear-gradient(180deg, #0f172a, #111827);
      box-shadow: 0 16px 45px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(4px);
    }

    .hud-item {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .health-bar {
      width: 110px;
      height: 14px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .health-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: linear-gradient(90deg, var(--success), #86efac);
      border-radius: 20px;
      transition: width 0.15s ease;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(59,130,246,0.08), rgba(15,23,42,0)),
        radial-gradient(circle at top, rgba(56,189,248,0.15), transparent 40%);
      touch-action: none;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px;
      pointer-events: none;
      z-index: 12;
    }

    .move-pad,
    .shoot-pad {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .control-btn {
      width: 66px;
      height: 66px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 28px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      user-select: none;
      touch-action: manipulation;
    }

    .control-btn:active {
      transform: scale(0.96);
    }

    .shoot-btn {
      width: 82px;
      height: 82px;
      background: rgba(239,68,68,0.78);
      font-size: 30px;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .restart-wrap {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      z-index: 20;
    }

    .restart-wrap.visible {
      display: flex;
    }

    .panel {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      text-align: center;
      padding: 22px 26px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 26px;
      color: #f8fafc;
    }

    .panel p {
      margin: 0 0 16px;
      font-size: 18px;
      color: #dbeafe;
    }

    .restart-btn {
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--accent), #0284c7);
      color: white;
      padding: 14px 26px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(14,165,233,0.35);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="hud-item">Score: <span id="score">0</span></div>
      <div class="health-bar" aria-label="Player health">
        <div id="healthFill" class="health-fill"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="420" height="760"></canvas>

    <div class="controls">
      <div class="move-pad">
        <button class="control-btn" id="leftBtn" aria-label="Move left">◀</button>
        <button class="control-btn" id="rightBtn" aria-label="Move right">▶</button>
      </div>

      <div class="shoot-pad">
        <button class="control-btn shoot-btn" id="shootBtn" aria-label="Shoot">✦</button>
      </div>
    </div>

    <div id="restartWrap" class="restart-wrap">
      <div class="panel">
        <h2>Game Over</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn" class="restart-btn">Restart</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const healthFill = document.getElementById("healthFill");
    const restartWrap = document.getElementById("restartWrap");
    const finalScoreEl = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const shootBtn = document.getElementById("shootBtn");

    const game = {
      width: canvas.width,
      height: canvas.height,
      running: true,
      score: 0,
      maxHealth: 100,
      health: 100,
      spawnTimer: 0,
      lastTime: 0,
      enemySpeed: 1.8,
      keys: {
        left: false,
        right: false
      },
      firePressed: false
    };

    const player = {
      x: game.width / 2 - 22,
      y: game.height - 90,
      w: 44,
      h: 26,
      speed: 5,
      color: "#38bdf8",
      cooldown: 0
    };

    const bullets = [];
    const enemies = [];
    const particles = [];

    function resetGame() {
      game.running = true;
      game.score = 0;
      game.health = game.maxHealth;
      game.spawnTimer = 0;
      game.enemySpeed = 1.8;
      player.x = game.width / 2 - player.w / 2;
      player.y = game.height - 90;
      player.cooldown = 0;
      bullets.length = 0;
      enemies.length = 0;
      particles.length = 0;
      scoreEl.textContent = "0";
      healthFill.style.width = "100%";
      restartWrap.classList.remove("visible");
      finalScoreEl.textContent = "0";
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function spawnEnemy() {
      const size = 22 + Math.random() * 18;
      enemies.push({
        x: Math.random() * (game.width - size),
        y: -size,
        w: size,
        h: size,
        speed: 1.5 + Math.random() * 1.8 + game.enemySpeed * 0.15,
        color: `hsl(${Math.random() * 40 + 8}, 80%, 60%)`,
        hitFlash: 0
      });
    }

    function shoot() {
      if (!game.running) return;
      if (player.cooldown > 0) return;

      bullets.push({
        x: player.x + player.w / 2 - 3,
        y: player.y - 14,
        w: 6,
        h: 14,
        speed: 9,
        color: "#fbbf24"
      });

      player.cooldown = 180;
    }

    function createParticles(x, y, color, amount = 10) {
      for (let i = 0; i < amount; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          r: 2 + Math.random() * 3,
          color,
          alpha: 1
        });
      }
    }

    function hitPlayer() {
      game.health -= 15;
      if (game.health <= 0) {
        game.health = 0;
        endGame();
      }
      healthFill.style.width = `${(game.health / game.maxHealth) * 100}%`;
    }

    function endGame() {
      game.running = false;
      finalScoreEl.textContent = game.score;
      restartWrap.classList.add("visible");
    }

    function update(dt) {
      if (!game.running) return;

      if (game.keys.left) {
        player.x -= player.speed * dt;
      }
      if (game.keys.right) {
        player.x += player.speed * dt;
      }

      player.x = clamp(player.x, 0, game.width - player.w);
      player.cooldown = Math.max(0, player.cooldown - dt);

      if (game.firePressed) shoot();

      game.spawnTimer += dt;
      if (game.spawnTimer > 700) {
        spawnEnemy();
        game.spawnTimer = 0;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed * (dt / 16.67);

        if (b.y + b.h < 0) {
          bullets.splice(i, 1);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * (dt / 16.67);

        if (
          e.x < player.x + player.w &&
          e.x + e.w > player.x &&
          e.y < player.y + player.h &&
          e.y + e.h > player.y
        ) {
          createParticles(e.x + e.w / 2, e.y + e.h / 2, "#ef4444", 18);
          enemies.splice(i, 1);
          hitPlayer();
          continue;
        }

        if (e.y > game.height + 30) {
          enemies.splice(i, 1);
          if (game.running) {
            hitPlayer();
          }
          continue;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (
            b.x < e.x + e.w &&
            b.x + b.w > e.x &&
            b.y < e.y + e.h &&
            b.y + b.h > e.y
          ) {
            bullets.splice(j, 1);
            enemies.splice(i, 1);
            game.score += 10;
            scoreEl.textContent = game.score;
            createParticles(e.x + e.w / 2, e.y + e.h / 2, "#facc15", 12);
            break;
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * (dt / 16.67);
        p.y += p.vy * (dt / 16.67);
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      game.enemySpeed = 1.8 + game.score / 200;
    }

    function draw() {
      ctx.clearRect(0, 0, game.width, game.height);

      for (let i = 0; i < 40; i++) {
        const sx = (i * 73) % game.width;
        const sy = (i * 97) % game.height;
        ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 5) * 0.12})`;
        ctx.fillRect(sx, sy, 2, 2);
      }

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);

      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }

      for (const e of enemies) {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.w, e.h);
      }

      for (const p of particles) {
        let alphaHex = Math.round(p.alpha * 255).toString(16).padStart(2, "0");
        ctx.fillStyle = p.color.startsWith("#") ? p.color + alphaHex : p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function gameLoop(timestamp) {
      const dt = Math.min(40, timestamp - (game.lastTime || timestamp));
      game.lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") game.keys.left = true;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") game.keys.right = true;
      if (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        e.preventDefault();
        game.firePressed = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") game.keys.left = false;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") game.keys.right = false;
      if (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        game.firePressed = false;
      }
    });

    function bindPress(control, keyName) {
      control.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (keyName === "left") game.keys.left = true;
        if (keyName === "right") game.keys.right = true;
        if (keyName === "shoot") game.firePressed = true;
      });

      control.addEventListener("pointerup", () => {
        if (keyName === "left") game.keys.left = false;
        if (keyName === "right") game.keys.right = false;
        if (keyName === "shoot") game.firePressed = false;
      });

      control.addEventListener("pointerleave", () => {
        if (keyName === "left") game.keys.left = false;
        if (keyName === "right") game.keys.right = false;
        if (keyName === "shoot") game.firePressed = false;
      });
    }

    bindPress(leftBtn, "left");
    bindPress(rightBtn, "right");
    bindPress(shootBtn, "shoot");

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      game.firePressed = true;
    });

    canvas.addEventListener("pointerup", () => {
      game.firePressed = false;
    });

    canvas.addEventListener("pointerleave", () => {
      game.firePressed = false;
    });

    restartBtn.addEventListener("click", () => {
      resetGame();
    });

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
