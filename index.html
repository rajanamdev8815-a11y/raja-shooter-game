```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-icon {
            width: 45px;
            height: 45px;
            background: white;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .bot-name {
            font-size: 18px;
            font-weight: bold;
        }

        .online {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 3px;
        }

        .clear-btn {
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Chat messages */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f7f7fb;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 14px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .user .message-content {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .time {
            display: block;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.6;
        }

        /* Typing */
        .typing {
            display: none;
            margin-bottom: 15px;
        }

        .typing span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* Quick buttons */
        .quick-buttons {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: white;
        }

        .quick-buttons button {
            white-space: nowrap;
            border: 1px solid #ddd;
            background: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .quick-buttons button:hover {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        /* Input */
        .chat-input {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
            background: white;
        }

        .chat-input input {
            flex: 1;
            border: 1px solid #ddd;
            outline: none;
            padding: 13px 15px;
            border-radius: 25px;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #4f46e5;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #3730a3;
        }

        /* Mobile */
        @media (max-width: 500px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

            <div class="bot-info">
                <div class="bot-icon">🤖</div>

                <div>
                    <div class="bot-name">My AI Assistant</div>
                    <div class="online">● Online</div>
                </div>
            </div>

            <button class="clear-btn" onclick="clearChat()">
                Clear
            </button>

        </div>


        <!-- Chat Messages -->
        <div class="chat-box" id="chatBox">

            <div class="message bot">
                <div class="message-content">
                    👋 Hello! I am your AI Assistant.
                    <br><br>
                    How can I help you today?
                    <span class="time">Now</span>
                </div>
            </div>

            <!-- Typing animation -->
            <div class="typing" id="typing">
                <div class="message-content">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

        </div>


        <!-- Quick Questions -->
        <div class="quick-buttons">

            <button onclick="quickMessage('What is AI?')">
                🤖 What is AI?
            </button>

            <button onclick="quickMessage('What is HTML?')">
                💻 What is HTML?
            </button>

            <button onclick="quickMessage('What is Python?')">
                🐍 Python
            </button>

            <button onclick="quickMessage('Tell me a joke')">
                😂 Joke
            </button>

        </div>


        <!-- Input -->
        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button class="send-btn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const typing = document.getElementById("typing");


        // Send message when Enter is pressed
        userInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // Get current time
        function getTime() {

            const now = new Date();

            return now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

        }


        // Add message to chat
        function addMessage(message, sender) {

            const messageDiv = document.createElement("div");

            messageDiv.className = "message " + sender;

            messageDiv.innerHTML = `
                <div class="message-content">
                    ${message}
                    <span class="time">${getTime()}</span>
                </div>
            `;

            chatBox.insertBefore(messageDiv, typing);

            chatBox.scrollTop = chatBox.scrollHeight;

        }


        // Send user message
        function sendMessage() {

            const message = userInput.value.trim();

            if (message === "") {
                return;
            }

            addMessage(message, "user");

            userInput.value = "";

            showTyping();

            setTimeout(function() {

                hideTyping();

                const response = getBotResponse(message);

                addMessage(response, "bot");

            }, 1000);

        }


        // Quick message
        function quickMessage(message) {

            userInput.value = message;

            sendMessage();

        }


        // Show typing
        function showTyping() {

            typing.style.display = "block";

            chatBox.scrollTop = chatBox.scrollHeight;

        }


        // Hide typing
        function hideTyping() {

            typing.style.display = "none";

        }


        // Chatbot responses
        function getBotResponse(message) {

            const text = message.toLowerCase();


            if (
                text.includes("hello") ||
                text.includes("hi") ||
                text.includes("hey")
            ) {

                return "👋 Hello! Nice to meet you. How can I help you?";

            }


            if (text.includes("ai") ||
                text.includes("artificial intelligence")) {

                return `
                    🤖 <b>AI (Artificial Intelligence)</b> is a technology
                    that allows computers to perform tasks that normally
                    require human intelligence.
                    <br><br>
                    Examples: ChatGPT, voice assistants, recommendation
                    systems and image recognition.
                `;

            }


            if (text.includes("html")) {

                return `
                    💻 <b>HTML</b> stands for HyperText Markup Language.
                    <br><br>
                    It is used to create the structure of websites.
                    For example, headings, paragraphs, images, buttons
                    and forms.
                `;

            }


            if (text.includes("python")) {

                return `
                    🐍 <b>Python</b> is a popular programming language.
                    <br><br>
                    It is commonly used for Web Development, Data Science,
                    AI, Machine Learning and Automation.
                `;

            }


            if (text.includes("css")) {

                return `
                    🎨 <b>CSS</b> stands for Cascading Style Sheets.
                    <br><br>
                    CSS is used to make websites beautiful by controlling
                    colors, fonts, spacing, layouts and animations.
                `;

            }


            if (
                text.includes("javascript") ||
                text.includes("js")
            ) {

                return `
                    ⚡ <b>JavaScript</b> is a programming language used
                    to make websites interactive.
                    <br><br>
                    It can handle buttons, forms, animations, APIs and
                    dynamic content.
                `;

            }


            if (
                text.includes("github") ||
                text.includes("github pages")
            ) {

                return `
                    🚀 <b>GitHub Pages</b> is a service that can host
                    static websites directly from a GitHub repository.
                    <br><br>
                    You can host HTML, CSS and JavaScript websites
                    without purchasing separate hosting.
                `;

            }


            if (
                text.includes("joke") ||
                text.includes("funny")
            ) {

                return `
                    😂 Why did the programmer quit his job?
                    <br><br>
                    Because he didn't get enough <b>arrays</b>! 😄
                `;

            }


            if (
                text.includes("thank") ||
                text.includes("thanks")
            ) {

                return "😊 You're welcome! I'm always happy to help.";

            }


            if (
                text.includes("bye") ||
                text.includes("goodbye")
            ) {

                return "👋 Goodbye! Have a great day!";

            }


            return `
                🤔 That's an interesting question!
                <br><br>
                I am currently a simple chatbot. Try asking me about
                <b>AI, HTML, CSS, JavaScript, Python or GitHub Pages.</b>
            `;

        }


        // Clear chat
        function clearChat() {

            chatBox.innerHTML = `
                <div class="message bot">
                    <div class="message-content">
                        👋 Chat cleared!
                        <br><br>
                        How can I help you?
                        <span class="time">Now</span>
                    </div>
                </div>

                <div class="typing" id="typing">
                    <div class="message-content">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            // Update typing element
            window.typing = document.getElementById("typing");

        }

    </script>

</body>
</html>
```
